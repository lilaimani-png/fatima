<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fatima</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 0px) 1rem env(safe-area-inset-bottom, 0px);
      background: radial-gradient(circle at top, #1e1e2f, #0d0d15);
      color: #ffffff;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      padding: 3rem 4rem;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      max-width: 100%;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 0.35rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .select-btn {
      padding: 0.85rem 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(118, 75, 162, 0.35);
    }

    .select-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(118, 75, 162, 0.5);
    }

    .select-btn:active {
      transform: translateY(0);
    }

    .message {
      display: none;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ff9eb8;
    }

    .message.show {
      display: block;
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
      h1 { font-size: 2.2rem; letter-spacing: 0.2rem; }
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>FATIMA</h1>
    <button class="select-btn" onclick="showMessage()">Select</button>
    <p class="message" id="message" role="status" aria-live="polite">Stop watching Bollywood movies 🤦‍♂️💔</p>
  </main>

  <script>
    function showMessage() {
      document.getElementById("message").classList.add("show");
    }
  </script>

</body>
</html>
